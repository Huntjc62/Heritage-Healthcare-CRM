<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Office Dashboard | Heritage Healthcare CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#183153;--blue:#0094d8;--blue2:#0079b4;--bg:#f4f7fb;--muted:#6b7280;--border:#e1e7ee}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{background:var(--bg);color:var(--navy);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:var(--navy);padding:28px 18px;z-index:20}
.sidebar img{width:175px;display:block;margin:0 auto 38px}
.sidebar a{display:block;color:#fff;text-decoration:none;padding:13px 15px;border-radius:9px;margin-bottom:8px;font-weight:600}
.sidebar a:hover,.sidebar a.active{background:var(--blue)}
.logout{width:100%;margin-top:25px;padding:12px;border-radius:9px;border:1px solid #ffffff40;background:transparent;color:white}
.main{margin-left:260px;padding:34px;min-height:100vh}
.topbar{background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 10px 30px #18315314;margin-bottom:28px;display:flex;justify-content:space-between;align-items:center}
.user{font-weight:700}.meta,.muted{color:var(--muted);font-size:13px;margin-top:4px}
.page-title{margin-bottom:24px}.page-title h1{font-size:32px}.page-title p{color:var(--muted);margin-top:6px}
.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--border);color:var(--navy)}
@media(max-width:760px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0;padding:18px}.topbar{align-items:flex-start;gap:12px}}
</style></head><body>
<aside class="sidebar"><img src="branding/logo-white.png" alt="Heritage Healthcare"><nav><a class="active" href="franchise_home.html">🏠 Dashboard</a><a class="" href="pipeline.html">📥 Pipeline</a><a class="" href="analytics.html">📊 Analytics</a><a class="" href="reports.html">📄 Reports</a><a class="" href="notifications.html">🔔 Notifications</a></nav><button class="logout" id="logoutBtn">Log out</button></aside>
<main class="main"><div class="topbar"><div><div class="user" id="welcome">Welcome</div><div class="meta" id="officeMeta">Loading...</div></div><button class="btn primary" onclick="location.href='new_enquiry.html'">+ New Enquiry</button></div>
<div class="page-title"><h1>Office Dashboard</h1><p>Live CRM overview for the signed-in user.</p></div>
<div id="kpis" style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px"></div>
<div style="background:#fff;padding:25px;border-radius:14px;box-shadow:0 10px 30px #18315314"><h2>Latest Enquiries</h2><div style="overflow:auto;margin-top:15px"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:10px">Name</th><th style="text-align:left;padding:10px">Office</th><th style="text-align:left;padding:10px">Service</th><th style="text-align:left;padding:10px">Status</th></tr></thead><tbody id="latest"></tbody></table></div></div></main>
<script type="module">
import {auth} from "./firebase.js";
import {signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
document.getElementById("logoutBtn").onclick=async()=>{await signOut(auth);location.replace("index.html")};
import {db} from "./firebase.js";import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import {doc,getDoc,collection,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
onAuthStateChanged(auth,async u=>{if(!u){location.replace("index.html");return};const s=await getDoc(doc(db,"users",u.uid));if(!s.exists())return;const p=s.data();if(p.active===false){location.replace("index.html");return};if((false&&p.role!=="admin")||(true&&p.role==="admin")){location.replace("home.html");return};welcome.textContent="Welcome back, "+(p.name||u.email);officeMeta.textContent=p.role==="admin"?"Head Office • All Offices":p.office;const q=p.role==="admin"?query(collection(db,"enquiries")):query(collection(db,"enquiries"),where("office","==",p.office));onSnapshot(q,snap=>{const r=snap.docs.map(d=>d.data());const c={new:r.filter(x=>x.status==="New").length,contacted:r.filter(x=>x.status==="Contacted").length,won:r.filter(x=>x.status==="Closed - Won").length,total:r.length};kpis.innerHTML=[["Total Enquiries",c.total],["New",c.new],["Contacted",c.contacted],["Closed - Won",c.won]].map(x=>`<div style="background:#fff;padding:22px;border-radius:12px;box-shadow:0 8px 25px #18315312"><small>${x[0]}</small><strong style="display:block;font-size:32px;margin-top:8px">${x[1]}</strong></div>`).join("");latest.innerHTML=r.slice(-8).reverse().map(x=>`<tr><td style="padding:10px;border-bottom:1px solid #eee">${x.firstName||""} ${x.lastName||""}</td><td style="padding:10px;border-bottom:1px solid #eee">${x.office||""}</td><td style="padding:10px;border-bottom:1px solid #eee">${x.service||""}</td><td style="padding:10px;border-bottom:1px solid #eee">${x.status||""}</td></tr>`).join("")||"<tr><td colspan=4>No enquiries yet.</td></tr>"})});
</script></body></html>
