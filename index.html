<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heritage Healthcare CRM | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{

    background:#eef3f8;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

}

.login-container{

    width:100%;
    max-width:460px;

    background:white;

    border-radius:18px;

    padding:45px;

    box-shadow:0 20px 50px rgba(0,0,0,.12);

}

.logo{

    display:block;

    width:190px;

    margin:0 auto 25px;

}

h1{

    text-align:center;

    color:#183153;

    font-size:30px;

    margin-bottom:10px;

}

.subtitle{

    text-align:center;

    color:#666;

    margin-bottom:35px;

    line-height:1.6;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

    color:#183153;

}

input[type=email],
input[type=password]{

    width:100%;

    padding:15px;

    border:1px solid #d8d8d8;

    border-radius:10px;

    margin-bottom:22px;

    font-size:15px;

    transition:.25s;

}

input:focus{

    outline:none;

    border-color:#0094d8;

    box-shadow:0 0 0 3px rgba(0,148,216,.15);

}

.options{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:28px;

    font-size:14px;

}

.options label{

    display:flex;

    align-items:center;

    gap:8px;

    font-weight:400;

    margin:0;

}

.options input{

    margin:0;

}

.options a{

    color:#0094d8;

    text-decoration:none;

}

.options a:hover{

    text-decoration:underline;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:#0094d8;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;

}

button:hover{

    background:#0078b1;

}

#error{

    display:none;

    margin-top:20px;

    background:#ffe8e8;

    color:#b00020;

    padding:14px;

    border-radius:8px;

    text-align:center;

}

#loading{

    display:none;

    margin-top:20px;

    text-align:center;

    color:#666;

}

.spinner{

    width:42px;

    height:42px;

    border:4px solid #ddd;

    border-top:4px solid #0094d8;

    border-radius:50%;

    margin:0 auto 15px;

    animation:spin 1s linear infinite;

}

@keyframes spin{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}

.footer{

    text-align:center;

    margin-top:35px;

    color:#888;

    font-size:13px;

}

.version{

    margin-bottom:6px;

}

</style>

</head>

<body>

<div class="login-container">

<img
src="branding/logo.jpg"
class="logo"
alt="Heritage Healthcare">

<h1>

Welcome Back

</h1>

<p class="subtitle">

Secure access for Head Office and Franchise users.

Sign in using your Heritage Healthcare account.

</p>

<label>

Email Address

</label>

<input
type="email"
id="email"
placeholder="Enter your email">

<label>

Password

</label>

<input
type="password"
id="password"
placeholder="Enter your password">

<div class="options">

<label>

<input
type="checkbox"
id="remember">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button id="loginButton">

Sign In

</button>

<div id="loading">

<div class="spinner"></div>

Signing you in...

</div>

<div id="error">

Incorrect email address or password.

</div>

<div class="footer">

<div class="version">

Version 2.0

</div>

© 2026 Heritage Healthcare CRM

</div>

</div>

<!-- Part 2 starts here -->
<script type="module">

// =========================================
// Heritage Healthcare CRM
// Firebase Login
// =========================================

import { auth, db } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// =========================================
// Check Existing Login
// =========================================

onAuthStateChanged(auth, async(user)=>{

    if(!user){

        return;

    }

    try{

        const q = query(

            collection(db,"users"),

            where("email","==",user.email)

        );

        const snapshot =
        await getDocs(q);

        if(snapshot.empty){

            return;

        }

        const profile =
        snapshot.docs[0].data();

        localStorage.setItem("userEmail",profile.email);

        localStorage.setItem("userName",profile.name);

        localStorage.setItem("office",profile.office);

        localStorage.setItem("role",profile.role);

        if(profile.role==="admin"){

            window.location.replace("home.html");

        }else{

            window.location.replace("franchise_home.html");

        }

    }

    catch(error){

        console.error(error);

    }

});


// =========================================
// Login Function
// =========================================

async function login(){

    document.getElementById("error").style.display="none";

    document.getElementById("loading").style.display="block";

    const email =
    document.getElementById("email")
    .value
    .trim()
    .toLowerCase();

    const password =
    document.getElementById("password")
    .value;

    if(email==="" || password===""){

        document.getElementById("loading").style.display="none";

        document.getElementById("error").innerHTML=
        "Please enter your email and password.";

        document.getElementById("error").style.display="block";

        return;

    }

    try{

        // Authenticate with Firebase

        await signInWithEmailAndPassword(

            auth,

            email,

            password

        );

        // Get user profile

        const q = query(

            collection(db,"users"),

            where("email","==",email)

        );

        const snapshot =
        await getDocs(q);

        if(snapshot.empty){

            throw new Error("User profile not found.");

        }

        const profile =
        snapshot.docs[0].data();

        if(profile.active===false){

            throw new Error("This account has been disabled.");

        }

        // Save session

        localStorage.setItem("userEmail",profile.email);

        localStorage.setItem("userName",profile.name);

        localStorage.setItem("office",profile.office);

        localStorage.setItem("role",profile.role);

        localStorage.setItem(

            "lastLogin",

            new Date().toLocaleString("en-GB")

        );

        // Remember email

        if(document.getElementById("remember").checked){

            localStorage.setItem(

                "rememberEmail",

                email

            );

        }else{

            localStorage.removeItem(

                "rememberEmail"

            );

        }

        // Redirect

        if(profile.role==="admin"){

            window.location.replace("home.html");

        }else{

            window.location.replace("franchise_home.html");

        }

    }

    catch(error){

        console.error(error);

        document.getElementById("loading").style.display="none";

        document.getElementById("error").innerHTML=

            error.message ||

            "Login failed.";

        document.getElementById("error").style.display="block";

    }

}


// =========================================
// Login Button
// =========================================

document

.getElementById("loginButton")

.addEventListener(

    "click",

    login

);


// =========================================
// Press Enter
// =========================================

document.addEventListener("keydown",(e)=>{

    if(e.key==="Enter"){

        login();

    }

});


// =========================================
// Remember Email
// =========================================

const rememberedEmail =
localStorage.getItem("rememberEmail");

if(rememberedEmail){

    document.getElementById("email").value =
    rememberedEmail;

    document.getElementById("remember").checked = true;

}

</script>

</body>

</html>
