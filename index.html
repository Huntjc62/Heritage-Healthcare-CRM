<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heritage Healthcare CRM | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{

    background:#f4f6f9;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

}

.login-container{

    width:100%;
    max-width:450px;

    background:#fff;

    border-radius:15px;

    padding:40px;

    box-shadow:0 15px 35px rgba(0,0,0,.12);

}

.logo{

    display:block;

    width:190px;

    margin:0 auto 25px;

}

h1{

    font-size:26px;

    color:#183153;

    text-align:center;

    margin-bottom:10px;

}

.subtitle{

    text-align:center;

    color:#666;

    font-size:14px;

    margin-bottom:35px;

}

label{

    display:block;

    font-size:14px;

    font-weight:600;

    margin-bottom:8px;

    color:#183153;

}

input{

    width:100%;

    padding:14px;

    border:1px solid #d8d8d8;

    border-radius:8px;

    margin-bottom:20px;

    font-size:15px;

    transition:.2s;

}

input:focus{

    outline:none;

    border-color:#0094d8;

}

.options{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

    font-size:14px;

}

.options label{

    margin:0;

    display:flex;

    align-items:center;

    gap:8px;

    font-weight:400;

}

.options input{

    width:auto;

    margin:0;

}

.options a{

    text-decoration:none;

    color:#0094d8;

}

.options a:hover{

    text-decoration:underline;

}

button{

    width:100%;

    padding:15px;

    background:#0094d8;

    color:#fff;

    border:none;

    border-radius:8px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#007db8;

}

#error{

    display:none;

    margin-top:20px;

    padding:12px;

    border-radius:8px;

    background:#ffe9e9;

    color:#b00020;

    text-align:center;

}

#loading{

    display:none;

    text-align:center;

    margin-top:20px;

}

.spinner{

    width:40px;

    height:40px;

    border:4px solid #ddd;

    border-top:4px solid #0094d8;

    border-radius:50%;

    animation:spin 1s linear infinite;

    margin:0 auto 10px;

}

@keyframes spin{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}

.footer{

    text-align:center;

    margin-top:40px;

    font-size:13px;

    color:#888;

}

.version{

    margin-bottom:8px;

}

</style>

</head>

<body>

<div class="login-container">

<img src="branding/logo.jpg" class="logo" alt="Heritage Healthcare">

<h1>Welcome Back</h1>

<p class="subtitle">

Secure access for Head Office and Franchise users

</p>

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password">

<div class="options">

<label>

<input
type="checkbox"
id="remember">

Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>

<button onclick="login()">

Sign In

</button>

<div id="loading">

<div class="spinner"></div>

Signing you in...

</div>

<div id="error">

Incorrect email address or password.

</div>

<div class="footer">

<div class="version">

Version 2.0

</div>

© 2026 Heritage Healthcare CRM

</div>

</div>

<!-- =======================================
Firebase Login Script
Part 2 starts here
======================================= -->

<script type="module">
// =========================================
// Firebase Imports
// =========================================

import { auth, db } from "./firebase.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// =========================================
// Login Function
// =========================================

async function login(){

    // Hide previous messages

    document.getElementById("error").style.display="none";

    document.getElementById("loading").style.display="block";


    const email =
    document.getElementById("email")
    .value
    .trim()
    .toLowerCase();

    const password =
    document.getElementById("password")
    .value;


    try{

        // ===================================
        // Authenticate with Firebase
        // ===================================

        await signInWithEmailAndPassword(

            auth,

            email,

            password

        );


        // ===================================
        // Find User Record
        // ===================================

        const q = query(

            collection(db,"users"),

            where("email","==",email)

        );

        const snapshot =
        await getDocs(q);


        if(snapshot.empty){

            throw new Error(
                "User profile not found."
            );

        }


        const user =
        snapshot.docs[0].data();


        // ===================================
        // Check User Active
        // ===================================

        if(user.active===false){

            throw new Error(
                "This account has been disabled."
            );

        }


        // ===================================
        // Save Session
        // ===================================

        localStorage.setItem(

            "loggedIn",

            "true"

        );

        localStorage.setItem(

            "userEmail",

            user.email

        );

        localStorage.setItem(

            "userName",

            user.name

        );

        localStorage.setItem(

            "office",

            user.office

        );

        localStorage.setItem(

            "role",

            user.role

        );

        localStorage.setItem(

            "lastLogin",

            new Date().toLocaleString("en-GB")

        );


        // ===================================
        // Remember Me
        // ===================================

        if(document.getElementById("remember").checked){

            localStorage.setItem(

                "rememberEmail",

                email

            );

        }else{

            localStorage.removeItem(

                "rememberEmail"

            );

        }


        // ===================================
        // Redirect User
        // ===================================

        if(user.role==="admin"){

            window.location.href="home.html";

        }else{

            window.location.href="franchise_home.html";

        }

    }

    catch(error){

        console.error(error);

        document.getElementById("loading").style.display="none";

        document.getElementById("error").style.display="block";

    }

}
// =========================================
// Press Enter to Login
// =========================================

document.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        login();

    }

});


// =========================================
// Remember Me
// =========================================

const rememberedEmail =
localStorage.getItem("rememberEmail");

if(rememberedEmail){

    document.getElementById("email").value =
    rememberedEmail;

    document.getElementById("remember").checked = true;

}


// =========================================
// Check Existing Login
// =========================================

const loggedIn =
localStorage.getItem("loggedIn");

const role =
localStorage.getItem("role");

if(loggedIn==="true"){

    if(role==="admin"){

        window.location.href="home.html";

    }

    if(role==="franchise"){

        window.location.href="franchise_home.html";

    }

}


// =========================================
// Logout Function
// =========================================

window.logout=function(){

    localStorage.removeItem("loggedIn");
    localStorage.removeItem("userEmail");
    localStorage.removeItem("userName");
    localStorage.removeItem("office");
    localStorage.removeItem("role");
    localStorage.removeItem("lastLogin");

    window.location.href="index.html";

}

</script>

</body>

</html>
