<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | Heritage Healthcare CRM</title><style>
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}body{margin:0;min-height:100vh;background:#183153;display:grid;place-items:center;padding:20px}
.box{background:#fff;width:min(440px,100%);padding:38px;border-radius:18px;box-shadow:0 25px 70px #0004}h1{text-align:center;color:#183153}p{text-align:center;color:#6b7280}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#0094d8;color:#fff;font-weight:700}.error{display:none;margin-top:14px;padding:12px;background:#fff0f0;color:#a22;border-radius:8px}
</style></head><body><div class="box"><h1>Heritage Healthcare CRM</h1><p>Sign in to continue</p>
<form id="form"><label>Email address</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="btn">Sign in</button><div id="error" class="error"></div></form></div>
<script type="module">
import {auth,db} from "./firebase.js";
import {signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {doc,getDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const form=document.getElementById("form"),btn=document.getElementById("btn"),err=document.getElementById("error");
onAuthStateChanged(auth,async user=>{
 if(!user)return;
 const snap=await getDoc(doc(db,"users",user.uid));
 if(!snap.exists()){await signOut(auth);return;}
 const p=snap.data();
 if(p.active===false){await signOut(auth);return;}
 location.replace(p.role==="admin"?"home.html":"franchise_home.html");
});
form.onsubmit=async e=>{
 e.preventDefault();btn.disabled=true;btn.textContent="Signing in...";err.style.display="none";
 try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value)}
 catch(e){err.textContent="Unable to sign in. Please check your email and password.";err.style.display="block";btn.disabled=false;btn.textContent="Sign in"}
};
</script></body></html>
